<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Kegiatan — UPT Perlindungan Perempuan dan Anak Kota Palembang</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="custom.css" />
</head>
<body>
  <div id="navbar-root"></div>
  <header class="page-header">
    <div class="upt-container page-header-inner">
      <h1>GALERI KEGIATAN UPT</h1>
      <nav class="breadcrumb"><a href="index.html">Beranda</a> <i class="fa-solid fa-chevron-right"></i> Galeri</nav>
    </div>
  </header>
  <main class="page-body">
    <div class="upt-container">
      <p class="page-intro">Grid galeri siap diisi foto dokumentasi resmi. Klik item untuk pratinjau. Bukan foto model stok atau gambar AI yang seolah-olah dokumentasi pemerintah.</p>
      <div class="filter-bar" id="galeri-filter">
        <button type="button" class="filter-btn active" data-kat="semua">Semua</button>
        <button type="button" class="filter-btn" data-kat="pelayanan">Pelayanan</button>
        <button type="button" class="filter-btn" data-kat="sosialisasi">Sosialisasi</button>
        <button type="button" class="filter-btn" data-kat="pendampingan">Pendampingan</button>
        <button type="button" class="filter-btn" data-kat="edukasi">Edukasi</button>
        <button type="button" class="filter-btn" data-kat="kegiatan">Kegiatan</button>
      </div>
      <div class="gallery-grid" id="galeri-grid"></div>
    </div>
  </main>
  <div id="footer-root"></div>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script src="js/site-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
